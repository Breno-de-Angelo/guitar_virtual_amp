[package]
name = "guitar_core"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam = "0.8.4"
eframe = { version = "0.32.1", default-features = false, features = ["glow", "default_fonts"] }
egui_plot = "0.33.0"
num-complex = "0.4.6"
rustfft = "6.4.0"
strum = "0.27.2"
strum_macros = "0.27.2"
cpal = "0.18"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
hound = "3.5"

# rfd has no Android backend at all (it only supports desktop/web toolkits),
# so it must not be built for the Android target or `cargo apk build` fails
# at compile time. `cabinet_ui` falls back to a plain text field for the IR
# path on Android instead of a native file picker.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
