[package]
name = "guitar_core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
crossbeam = "0.8.4"
eframe = { version = "0.32.1", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui_plot = "0.33.0"
num-complex = "0.4.6"
rustfft = "6.4.0"
strum = "0.27.2"
strum_macros = "0.27.2"
cpal = "0.18"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
hound = "3.5"
nam-rs = "0.4.0"
ureq = { version = "3.5.2", features = ["json"] }
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
webbrowser = "1.2.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
guitarpro = "0.5"
rustysynth = "1.3"
# Pure-Rust ONNX inference for the transcription models (Basic Pitch, the
# guitar CRNN, Beat This!). 0.23+: older tract runs Beat This! ~15x slower.
tract-onnx = "0.23"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "isomp4", "aac"] }

# rfd has no Android backend at all (it only supports desktop/web toolkits),
# so it must not be built for the Android target or `cargo apk build` fails
# at compile time. `cabinet_ui` falls back to a plain text field for the IR
# path on Android instead of a native file picker.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
# MIDI footswitches/controllers (`backend::midi`). Desktop only: midir has
# no Android backend.
midir = "0.11"
