[workspace]
resolver = "2"
members = [
    "guitar_core",
    "guitar_desktop",
    "guitar_android",
]

# The transcription model (tract) is unusably slow unoptimized; optimize it
# even in dev builds so `cargo run` transcribes in seconds, not minutes.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.tract-extra]
opt-level = 3
[profile.dev.package.tract-transformers]
opt-level = 3
# Same for audio decoding: a 7-minute m4a (YouTube previews, backing
# tracks) decodes in ~1.7 s instead of ~5 s.
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
