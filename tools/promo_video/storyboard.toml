# ---------------------------------------------------------------- scenes --
# One string rings in tune, then the metronome counts the band in.
[[scene]]
id = "tuner"
bars = 2
title = "Tune up"
subtitle = "Tuner with string targets for standard, drop, open and 7-string tunings, and a metronome."
page = "Tuner"
preset = "Clean Jazz"
guitar = { tune = "5:0", cents = [-35, 0] }
actions = [
    { beat = 4, key = "K" },
]

[[scene]]
id = "intro"
layout = "title"
bars = 4
title = "Guitar Virtual Amp"
subtitle = "A real-time guitar rig for desktop and Android"
preset = "Ambient Ping-Pong"
guitar = { riff = "arpeggio" }
bass = "bass_whole"
drums = "soft"

# A bar of the dry guitar, then every pedal comes on with the band.
[[scene]]
id = "pedalboard"
bars = 4
title = "Build your pedalboard"
subtitle = "{pedal_count} effect pedals in any order. Bypass, A/B and undo every edit."
page = "Pedals"
preset = "Metal High Gain"
bypass_all = true
guitar = { riff = "rhythm" }
double = true
bass = "bass_entry"
drums = "entry"
# Clicks that change the chain land just before the downbeat: the pedals
# are rebuilt (a few ms of silence), then the new tone hits with the band.
actions = [
    { beat = 3.92, click = "Enable all" },
    { beat = 6, zoom = [100, 145, 900, 300], secs = 1.0 },
    { beat = 12, unzoom = true, secs = 1.0 },
]

# A new tone on every downbeat.
[[scene]]
id = "presets"
bars = 4
title = "{preset_count} factory presets"
subtitle = "Plus your own, with tags, search and a setlist for the gig."
page = "Presets"
preset = "Blues Crunch"
guitar = { riff = "rhythm" }
double = true
bass = "bass_eighths"
drums = "rock"
actions = [
    { beat = 3.92, click = "Classic Rock Rhythm" },
    { beat = 7.92, click = "Shoegaze Wall" },
    { beat = 11.92, click = "Metal High Gain" },
]

[[scene]]
id = "nam"
bars = 2
title = "Neural Amp Modeler and TONE3000"
subtitle = "Load .nam captures and speaker IRs, or browse TONE3000 right from the pedal."
page = "Pedals"
preset = "Metal High Gain"
guitar = { riff = "rhythm" }
double = true
bass = "bass_eighths"
drums = "rock"
actions = [
    { beat = 2, click = "➕ Add pedal" },
    { beat = 3.92, click = "NAM Model" },
    { beat = 5.5, hover = "Browse TONE3000" },
]

[[scene]]
id = "analyzer"
bars = 2
title = "See your tone"
subtitle = "Oscilloscope and spectrum of the dry guitar or of the pedals' output."
page = "Analyzer"
preset = "Metal High Gain"
guitar = { riff = "heavy" }
double = true
bass = "bass_heavy"
drums = "heavy"
setup = [
    { click = "after the pedals" },
]

# The tab player scores the melody against the tab, with the band.
[[scene]]
id = "tabs"
bars = 4
title = "Play along with tabs"
subtitle = "Guitar Pro files, bar loops and a speed trainer. Practice mode scores every note you play."
tab = true
preset = "Rock Lead"
guitar = { riff = "lead" }
backing = [{ riff = "pads", preset = "Classic Rock Rhythm", gain_db = -7.0 }]
bass = "bass_solo"
drums = "solo"
setup = [
    { click = "🎯 Prática" },
    { key = "Space" },
]

[[scene]]
id = "phone"
layout = "phone"
bars = 4
title = "Desktop and Android"
subtitle = "The same app on Linux, Windows, macOS and Android."
bullets = ["Touch-size controls on phones", "Dark and light themes", "MIDI footswitches on desktop"]
page = "Pedals"
preset = "Pop Clean"
theme = "light"
guitar = { riff = "arpeggio" }
bass = "bass_whole"
drums = "groove"

[[scene]]
id = "outro"
layout = "title"
bars = 3
title = "Guitar Virtual Amp"
subtitle = "Free and open source (GPL-3.0), written in Rust"
bullets = [
    "{pedal_count} pedals · {preset_count} presets · tuner · tabs · practice · transcription",
    "github.com/Breno-de-Angelo/guitar_virtual_amp",
]
footnote = "Guitar notes: Guitar-TECHS (Pedroza et al., ICASSP 2025), CC BY 4.0 · Bass and drums: GeneralUser GS by S. Christian Collins · Every guitar tone by the app's own pedals"
preset = "Shoegaze Wall"
guitar = { riff = "last_chord" }
double = true
bass = "bass_end"
drums = "end"
