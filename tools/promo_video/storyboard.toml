# The promo video: one piece of music (E minor, 100 bpm), scene after
# scene on the bar lines. Render it with `cargo run` in this folder; see
# README.md for every field, the notation and the action verbs.
#
# To show a new feature: add a [[scene]] where it fits the song, give it a
# page, a preset and parts to play, and script the clicks on the beats.
# `{pedal_count}`, `{preset_count}` and `{page_count}` in any text are
# filled in from the app's code, so they stay right as features are added.

[video]
width = 1920
height = 1080
fps = 30
output = "out/guitar_virtual_amp.mp4"
poster = "pedalboard@6.0"
fade = 0.3

[music]
bpm = 100
# GeneralUser GS (free, see README.md) plays the bass and drums.
soundfont = "~/.cache/gva_promo/GeneralUser-GS.sf2"
# Real DI recordings of every fret of every string, by two players
# (Guitar-TECHS, CC BY 4.0): player 1 is take 0, player 2 take 1.
guitars = [
    "~/.cache/gva_test/guitar_techs/P1_singlenotes/audio/directinput/directinput_allsinglenotes.wav:~/.cache/gva_test/prepared/notes/techs/P1_singlenotes/allsinglenotes.txt",
    "~/.cache/gva_test/guitar_techs/P2_singlenotes/audio/directinput/directinput_allsinglenotes.wav:~/.cache/gva_test/prepared/notes/techs/P2_singlenotes/allsinglenotes.txt",
]
guitar_db = -19.0
band_db = -22.0

# ---------------------------------------------------------------- guitar --
# Em(add9) - Cmaj7 - G6 - Dsus2, let ring.
[riffs.arpeggio]
ring = true
notes = "6:0 4:2 3:0 2:0 1:2 2:0 3:0 4:2 | 5:3 4:2 3:0 2:0 1:0 2:0 3:0 4:2 | 6:3 4:0 3:0 2:0 1:3 2:0 3:0 4:0 | 4:0 3:2 2:3 1:0 1:2 2:3 3:2 4:0"

# E5 - C5 - G5 - D5: open chords on 1 and the "and" of 2, palm-muted chugs between.
[riffs.rhythm]
notes = """
6:0+5:2+4:2! - 6:0m 6:0m 6:0+5:2+4:2 - 6:0m 6:0m |
5:3+4:5+3:5! - 5:3m 5:3m 5:3+4:5+3:5 - 5:3m 5:3m |
6:3+5:5+4:5! - 6:3m 6:3m 6:3+5:5+4:5 - 6:3m 6:3m |
5:5+4:7+3:7! - 5:5m 5:5m 5:5+4:7+3:7 - - -
"""

# Held chords under the solo.
[riffs.pads]
notes = "6:0+5:2+4:2 - - - - - - - | 5:3+4:5+3:5 - - - - - - - | 6:3+5:5+4:5 - - - - - - - | 5:5+4:7+3:7 - - - 5:5+4:7+3:7 - - -"

[riffs.heavy]
notes = "6:0m 6:0m 6:0m 6:0m 6:3+5:5! - 6:0m 6:0m | 6:0m 6:0m 6:0m 6:0m 6:5+5:7! - 6:6+5:8 6:7+5:9!"

# The tab scene's melody: G B A | G E G E | D E G B | A (vibrato).
[riffs.lead]
program = 29
notes = "2:8 - 1:7! - - - 1:5 - | 1:3 - 2:5 - 2:8 - 2:5 - | 2:3 - 2:5 - 1:3 - 1:7 - | 1:5~ - - - - - - ."

[riffs.last_chord]
ring = true
notes = "6:0+5:2+4:2+3:0+2:0+1:0! - - - - - - - - - - - - - - - - - - - - - - -"

# ------------------------------------------------------------------ bass --
[riffs.bass_whole]
instrument = "bass"
program = 33
notes = "4:0 - - - - - - - | 3:3 - - - - - - - | 4:3 - - - - - - - | 3:5 - - - - - 3:4 3:2"

[riffs.bass_eighths]
instrument = "bass"
program = 34
notes = "4:0! 4:0 4:0 4:0 4:0 4:0 4:0 4:0 | 3:3! 3:3 3:3 3:3 3:3 3:3 3:3 3:3 | 4:3! 4:3 4:3 4:3 4:3 4:3 4:3 4:3 | 3:5! 3:5 3:5 3:5 3:5 3:5 3:5 3:5"

# Silent for a bar while the guitar plays dry, then in.
[riffs.bass_entry]
instrument = "bass"
program = 34
notes = ". . . . . . . . | 3:3! 3:3 3:3 3:3 3:3 3:3 3:3 3:3 | 4:3! 4:3 4:3 4:3 4:3 4:3 4:3 4:3 | 3:5! 3:5 3:5 3:5 3:5 3:5 3:5 3:5"

[riffs.bass_heavy]
instrument = "bass"
program = 34
notes = "4:0 4:0 4:0 4:0 4:3! - 4:0 4:0 | 4:0 4:0 4:0 4:0 4:5! - 4:6 4:7!"

[riffs.bass_solo]
instrument = "bass"
program = 34
notes = "4:0! - - 4:0 4:0 - 4:0 4:0 | 3:3! - - 3:3 3:3 - 3:3 3:3 | 4:3! - - 4:3 4:3 - 4:3 4:3 | 3:5! - - 3:5 3:5 - 3:5 3:5"

[riffs.bass_end]
instrument = "bass"
program = 34
notes = "4:0! - - - - - - - - - - - - - - - . . . . . . . ."

# ----------------------------------------------------------------- drums --
[drums.soft]
kit = 8
kick = "x . . . . . . . | x . . . . x . ."
side = ". . . . x . . . | . . . . x . . ."
hat  = "o o o o o o o o | o o o o o o o o"

[drums.entry]
kit = 16
kick  = ". . . . . . . . | x . . x x . . . | x . . x x . . . | x . . x . . . ."
snare = ". . . . . . . . | . . x . . . x . | . . x . . . x . | . . x . x x . ."
hat   = ". . . . . . . . | x o x o x o x o | x o x o x o x o | x o x o . . . ."
crash = ". . . . . . . . | X . . . . . . . | . . . . . . . . | . . . . . . . ."
tom_hi  = ". . . . . . . . | . . . . . . . . | . . . . . . . . | . . . . . . x ."
tom_low = ". . . . . . . . | . . . . . . . . | . . . . . . . . | . . . . . . . x"

[drums.rock]
kit = 16
kick  = "x . . x x . . . | x . . x x . . . | x . . x x . . . | x . . x x . x ."
snare = ". . x . . . x . | . . x . . . x . | . . x . . . x . | . . x . . . x x"
hat   = "x o x o x o x o | x o x o x o x o | x o x o x o x o | x o x o x o . ."
crash = "X . . . . . . . | . . . . . . . . | . . . . . . . . | . . . . . . . ."

[drums.heavy]
kit = 16
kick  = "x x x x X . x x | x x x x X . x x"
snare = ". . . . X . . . | . . . . X . . X"
ride  = "x . x . x . x . | x . x . x . . ."
crash = "X . . . . . . . | . . . . X . . ."

[drums.solo]
kit = 16
kick  = "x . . x x . x . | x . . x x . x . | x . . x x . x . | x . . x x . . ."
snare = ". . x . . . x . | . . x . . . x . | . . x . . . x . | . . x . x x X X"
ride  = "x x x x x x x x | x x x x x x x x | x x x x x x x x | x x x x . . . ."
crash = "X . . . . . . . | . . . . . . . . | X . . . . . . . | . . . . . . . ."

[drums.groove]
kit = 8
kick = "x . . . . x . . | x . . x . x . ."
side = ". . x . . . x . | . . x . . . x ."
hat  = "x o x o x o x o | x o x o x o x o"

[drums.end]
kit = 16
kick  = "X . . . . . . . | . . . . . . . . | . . . . . . . ."
